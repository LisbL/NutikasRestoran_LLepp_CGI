<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Restorani Saaliplaan</title>
    <style>
        h1 {
            font-family: Georgia,cursive;
            border-right: 4px solid #000;
            animation: cursor 1s infinite step-end, typing 15s infinite steps(16);
            white-space: nowrap;
            overflow: hidden;
            margin: 20px auto;
            width: fit-content;
        }

        cursor {
            animation: cursor 1s infinite step-end;
        }

        @keyframes cursor{
            0%, 100%{border-color: transparent;}
            50%{border-color: #000;}
        }

        @keyframes typing{
            0%{ width: 0ch} /*Text is hidden*/
            30%{ width: 16ch;} /*The enitre header will be typed out 1 character at a time*/
            80%{ width: 16ch;} /*Text stays visible*/
            90%{ width: 0ch;} /*Text is deleted*/
            100%{ width: 0ch;} /*Text stays hidden*/
        }


        input {
            color: #CBE0E0;
            background-color: #70528b;
            padding: 10px;
            margin: 10px;
            font-size: 13px;
            border-radius: 10px;
            font-family: "Courier New",serif;
        }
        button {
            padding: 20px;
            font-size: 18px;
            margin: 20px;
            background-color: #a0615f;
            color: #CBE0E0;
            border-radius: 10px;
            font-family: "Courier New",serif;
        }
        button:hover {
            box-shadow: 10px 5px 5px #566e41;
            cursor: pointer;
        }

        select {
            padding: 20px;
            font-size: 18px;
            margin: 20px 10px;
            background-color: #a0615f;
            color: #CBE0E0;
            border-radius: 10px;
            font-family: "Courier New",serif;
        }

        label {
            padding: 20px;
            font-size: 18px;
            margin: 20px;
            border-radius: 10px;
            font-weight: bold;
            background-color: #CBE0E0;
        }

        Body {
            color: #70528b;
            text-align: center;
            font-family: "Courier New",serif;
            background:linear-gradient(to bottom, #aec39b, #566e41) ;
            margin-bottom: 50px;
        }

        #floor-plan {
            display: grid;
            gap: 10px;
            border: 2px ridge #445733;
            border-radius: 10px;
            padding: 20px;
            grid-template-columns: repeat(5, 1fr);/*1fr - fractional unit, muutub akna suurusega*/
            grid-template-rows: repeat(2, 100px);
        }
        .table-box {
            color: #CBE0E0;
            border: 1px groove #8867a5;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: azure;
        }
    </style>
</head>
    <body>
    <h1>Restorani saaliplaan</h1>
    <h2>Mida vähem karistuspunkte, seda parem laud teie soovile.</h2>
    <button onclick="loadTables()">Uuenda vaadet</button>
        <div id="floor-plan"></div>
        <div id="table-box"></div>
    <input type="number" id="sizeInput">
    <select id="zoneInput">
        <option value="">Kõik tsoonid</option>
        <option value="Sisesaal">Sisesaal</option>
        <option value="Terrass">Terrass</option>
        <option value="Privaatruum">Privaatruum</option>
    </select>
    <label for="timeInput">Broneeringu aeg:</label>
    <input type="datetime-local" id="timeInput">

    <div id="featuresInput">
        <label><input type="checkbox" value="Akna all"> Akna all</label>
        <label><input type="checkbox" value="Pistikupesaga"> Pistikupesaga</label>
        <label><input type="checkbox" value="Vaikne ala"> Vaikne ala</label>
    </div>


    <script>
        //küsin serverilt andmed
        //puhasta vana saaliplaani (et väldiks uute laudade joonistamist vanade peale)
        //tekitan iga laua jaoks uue kasti ja paneme selle õigesse ruutu

        window.onload = function() {
            const now = new Date();

            //Muudan aja formaati, mis sobib datetime-local sisendile
            //offset eemaldab ajavööndi vahe, saaksime kohaliku aja ISO formaadis
            const tzOffset = now.getTimezoneOffset() * 60000;
            const localISOTime = new Date(now - tzOffset).toISOString().slice(0, 16);

            document.getElementById('timeInput').min = localISOTime;
            document.getElementById('timeInput').value = localISOTime;
        }

        function loadTables() {
            //Koostan params objeckti, et saaksime sinna asju lisada
            const params = new URLSearchParams();
            //Loen väärtused HTML-i sisenditest
            const size = document.getElementById('sizeInput').value;
            const zone = document.getElementById('zoneInput').value;
            //Leian kõik valitud märkeruudud
            const selectedFeatures = Array.from(document.querySelectorAll('#featuresInput input:checked'))
                .map(cb => cb.value);

            //Kellaaeg
            const startTime = document.getElementById('timeInput').value;
            //Kontrollin mineviku sisestamist
            if (startTime) {
                const selectedDate = new Date(startTime);
                const now = new Date();
                if (selectedDate < now) {
                    alert("palun vali aeg tulevikus!");
                    return;
                }
                params.append('startTime', startTime);
            }

            //Lisan väärtused siis, kui nad on olemas
            if (size) params.append('size', size);
            if (zone) params.append('zone', zone);
            selectedFeatures.forEach(f => params.append('features', f));

            const url = `/api/tables?${params.toString()}`;
            console.log("Päringu aadress: ", url);
            const floorPlan = document.getElementById('floor-plan');

            fetch(url)
                .then(response => response.json())
                .then(tables => {
                    //Platsi puhastus
                    floorPlan.innerHTML = '';

                    // Leian parima (madalaima) skoori, mis üldse saadaval on
                    //Nimekiri on sorteeritud -> esimene laud kõige vähema punktidega
                    const bestScore = tables.length > 0 ? tables[0].score : null;

                    //käin kõik lauad läbi
                    tables.forEach(table => {
                        //loon uue div-elemendi
                        const tableDiv = document.createElement('div');
                        tableDiv.classList.add('table-box');

                        //Panen kirja laua info
                        tableDiv.innerHTML = `Laud ${table.id}<br>Kohti: ${table.size}<br>Karistuspunktid: ${table.score}`;

                        //Määran asukoha ruudustikus vastavalt Java koodist x ja y'le
                        tableDiv.style.gridColumn = table.x;
                        tableDiv.style.gridRow = table.y;

                        //Muudan värvi vastavalt laua broneeringule
                        if (table.occupied) {
                            tableDiv.style.backgroundColor = '#9c5e5d' //Punane ehk broneeritud
                        } else if (table.score === bestScore && (size || zone || selectedFeatures.length > 0)) {
                            // Kui laua skoor on võrdne parima võimaliku skooriga
                            // ja kasutaja on üldse mingeid eelistusi sisestanud
                            tableDiv.style.backgroundColor = '#558d8e';
                            tableDiv.innerHTML += `<br><b>SOOVITATUD!</b>`;
                        } else {
                            tableDiv.style.backgroundColor = '#84a567' //Roheline ehk vaba
                        }

                        floorPlan.appendChild(tableDiv);
                    });
                });
        }
        loadTables();
    </script>

    </body>
</html>
